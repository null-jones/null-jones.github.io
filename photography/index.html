            "images/c.jpg", "images/c2.jpg", "images/a.jpg", "images/s.jpg",
            "images/fsae1.jpg", "images/fsae2.jpg"
        ];

        var gallery = document.getElementById("gallery");

        function shuffleArray(array) {
            for (var i = array.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var temp = array[i];
                array[i] = array[j];
                array[j] = temp;
            }
        }

        shuffleArray(imgUrlArr);

        imgUrlArr.forEach(function(src) {
            var div = document.createElement("div");
            div.className = "gallery-item";
            var img = document.createElement("img");
            img.src = src;
            img.alt = "Photography by Ellie Jones";
            img.loading = "lazy";
            div.appendChild(img);
            gallery.appendChild(div);
        });
    </script>
